<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Basketball Scoreboard</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <div class="scoreboard">
            <!-- Home -->
            <div class="team">
                <h3>HOME</h3>
                <div class="score" id="home">0</div>
                <div class="buttons">
                    <button onclick="home1()">+1</button>
                    <button onclick="home2()">+2</button>
                    <button onclick="home3()">+3</button>
                </div>
            </div>

            <!-- Guest -->
            <div class="team">
                <h3>GUEST</h3>
                <div class="score" id="guest">0</div>
                <div class="buttons">
                    <button onclick="guest1()">+1</button>
                    <button onclick="guest2()">+2</button>
                    <button onclick="guest3()">+3</button>
                </div>
            </div>
        </div>

        <button class="reset-btn" onclick="reset()">RESET</button>
    </div>

    <script src="index.js"></script>
</body>
</html>
